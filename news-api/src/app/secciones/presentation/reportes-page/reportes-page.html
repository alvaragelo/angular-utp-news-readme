<h2>Reportes de Ventas y Distribución</h2>

<div class="row mt-3">
  @for (item of resumenReportes; track item.id) {
    <div class="col-md-4 mb-3">
      <div class="card border-info p-3 shadow-sm">
        <h5 class="text-info-emphasis">{{ item.categoria }}</h5>
        <p class="mb-1 text-muted">Unidades Distribuidas: <strong>{{ item.totalUnidades }}</strong></p>
        <p class="mb-0 text-success fw-bold">Monto Total: S/ {{ item.montoSoles.toFixed(2) }}</p>
      </div>
    </div>
  }
</div>
