<h2>Gestión de Clientes</h2>
<p class="text-muted">Sección de administración de clientes corporativos y al por mayor.</p>
<table class="table table-striped mt-3 align-middle">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Cliente / Razón Social</th>
      <th>RUC</th>
      <th>Estado</th>
    </tr>
  </thead>
  <tbody>
    @for (cliente of clientes; track cliente.id) {
      <tr>
        <td>{{ cliente.id }}</td>
        <td>{{ cliente.razonSocial }}</td>
        <td>{{ cliente.ruc }}</td>
        <td>
          <span class="badge" [class.bg-success]="cliente.estado === 'Activo'" [class.bg-secondary]="cliente.estado !== 'Activo'">
            {{ cliente.estado }}
          </span>
        </td>
      </tr>
    }
  </tbody>
</table>
