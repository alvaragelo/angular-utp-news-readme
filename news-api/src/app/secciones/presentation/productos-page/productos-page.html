<h2>Catálogo de Productos al Por Mayor</h2>

<div class="row mt-3">
  @for (prod of productos; track prod.id) {
    <div class="col-md-4 mb-3">
      <div class="card p-3 shadow-sm h-100">
        <h5 class="text-primary">{{ prod.nombre }}</h5>
        <p class="text-muted mb-2">Stock: {{ prod.stock }} unidades</p>
        <span class="fw-bold text-success fs-5">S/ {{ prod.precio.toFixed(2) }}</span>
      </div>
    </div>
  }
</div>
